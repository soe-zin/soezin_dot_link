<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soezin.link</title>
<meta name="description" content="Nothing lives at the root. Projects run on subdomains.">
<meta name="theme-color" content="#14181f">
<style>
  :root {
    --bg: #14181f;
    --panel: #1a1f28;
    --text: #d5d9e0;
    --dim: #7c8594;
    --accent: #f2b45a;
    --rule: #262c37;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: clamp(14px, 2.4vw, 17px);
    line-height: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .term {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    overflow: hidden;
  }
  .bar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--rule);
    color: var(--dim);
    font-size: 0.8em;
  }
  .screen { padding: 20px 20px 24px; min-height: 15em; }
  .line { white-space: pre-wrap; word-break: break-word; }
  .line[hidden] { display: none; }
  .prompt { color: var(--accent); }
  .out { color: var(--text); }
  .dim { color: var(--dim); }
  .gap { height: 0.85em; }
  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
  <main class="term" aria-label="soezin.link">
    <div class="bar">soe@soezin.link: ~</div>
    <div class="screen" id="screen">
      <div class="line"><span class="prompt">$ </span>whoami</div>
      <div class="line out">soe</div>
      <div class="gap"></div>
      <div class="line"><span class="prompt">$ </span>hostname</div>
      <div class="line out">soezin.link</div>
      <div class="gap"></div>
      <div class="line"><span class="prompt">$ </span>cat README</div>
      <div class="line out">Nothing lives at the root of this domain.</div>
      <div class="line out">Projects run on their own subdomains.</div>
      <div class="line out dim">If you were sent a link, check it for typos.</div>
      <div class="gap"></div>
      <div class="line"><span class="prompt">$ </span><span class="cursor" aria-hidden="true"></span></div>
    </div>
  </main>

<script>
  // Reveals the lines one at a time on load. Without JS, or with
  // reduced motion, the full page is simply shown.
  (function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    var rows = Array.prototype.slice.call(document.querySelectorAll("#screen > div"));
    rows.forEach(function (r) { r.hidden = true; });
    var i = 0;
    function next() {
      if (i >= rows.length) return;
      var r = rows[i++];
      r.hidden = false;
      var isCommand = r.querySelector(".prompt") && !r.querySelector(".cursor");
      setTimeout(next, r.classList.contains("gap") ? 120 : isCommand ? 520 : 260);
    }
    setTimeout(next, 400);
  })();
</script>
</body>
</html>
